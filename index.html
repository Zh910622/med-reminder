<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f9d63">
<title>吃药打卡</title>
<style>
  :root{
    --accent:#1f9d63;
    --accent-soft:#e3f5ec;
    --bg1:#eef5f0;
    --bg2:#e4eef7;
    --card:#ffffff;
    --text:#1d2b26;
    --sub:#7b8a84;
    --line:#e7ece9;
    --danger:#d64545;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh;color:var(--text);
  }
  .app{max-width:430px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}

  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  header .logo{width:40px;height:40px;border-radius:12px;background:var(--accent);
    display:flex;align-items:center;justify-content:center;flex:none}
  header h1{font-size:22px;font-weight:700}
  header .date{margin-left:auto;font-size:13px;color:var(--sub)}

  .chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px;
    font-size:12px;color:var(--sub);cursor:pointer;flex:none;margin-left:8px}
  .chip.ok{color:var(--accent);border-color:#bfe7d2;background:var(--accent-soft)}
  .chip.err{color:var(--danger);border-color:#f2c7c7;background:#fdf1f1}
  .chip.busy{color:#8a7b2f;border-color:#eee3b8;background:#fdf9e8}

  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(30,60,45,.06);margin-bottom:12px}

  .progress-top{display:flex;align-items:baseline;justify-content:space-between}
  .progress-top .label{font-size:13px;color:var(--sub)}
  .progress-top .num{font-size:22px;font-weight:700;color:var(--accent)}
  .bar{height:10px;border-radius:99px;background:#e8efe9;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#35b878,#1f9d63);transition:width .35s ease}

  .all-done{display:none;background:var(--accent-soft);border:1px solid #bfe7d2;color:#157a4b;
    border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:12px}
  .all-done.show{display:block}

  form.add{display:flex;gap:8px}
  form.add input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;outline:none;background:#fafcfb}
  form.add input:focus{border-color:var(--accent)}
  form.add select{border:1.5px solid var(--line);border-radius:12px;padding:11px 8px;font-size:14px;background:#fafcfb;outline:none;color:var(--text)}
  form.add button{border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;padding:11px 18px;cursor:pointer}
  form.add button:active{transform:scale(.97)}

  ul{list-style:none}
  li.med{position:relative}
  li.med .name{font-size:16px;font-weight:700;padding-right:30px;cursor:pointer}
  li.med .sub{font-size:12.5px;color:var(--sub);margin-top:3px}
  li.med .del{position:absolute;top:12px;right:10px;width:28px;height:28px;border:none;border-radius:8px;
    background:transparent;color:#b9c2be;font-size:20px;line-height:1;cursor:pointer}
  li.med .del:hover{color:var(--danger);background:#fdf0f0}

  .dots{display:flex;gap:14px;margin-top:13px;flex-wrap:wrap}
  .slot{display:flex;flex-direction:column;align-items:center;gap:3px}
  .dot{width:40px;height:40px;border-radius:50%;border:2px solid #cfdad4;background:#fff;
    font-size:18px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .dot:active{transform:scale(.9)}
  .dot.on{background:var(--accent);border-color:var(--accent)}
  .stime{font-size:11px;color:var(--sub);cursor:pointer;border-bottom:1px dashed #c3cfca;line-height:1.3}
  .stime:hover{color:var(--accent);border-bottom-color:var(--accent)}

  .med.done{background:linear-gradient(180deg,#f4fbf7,#ffffff)}
  .med.done .name{color:var(--accent)}

  .history{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);align-items:center}
  .history .h-label{font-size:11px;color:var(--sub);margin-right:2px;flex:none}
  .h{flex:1;height:26px;border-radius:7px;background:#eef2ef;color:#9aa8a1;font-size:11px;
    display:flex;align-items:center;justify-content:center;font-weight:600}
  .h.full{background:var(--accent);color:#fff}
  .h.partial{background:#b7e2cc;color:#14603c}
  .h.today{outline:2px solid #ffe08a;outline-offset:-1px}

  .empty{text-align:center;color:var(--sub);font-size:14px;padding:34px 0;display:none}
  .empty.show{display:block}

  footer{text-align:center;font-size:12px;color:#a5b1ab;margin-top:18px;line-height:1.7}

  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:#223330;color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 云同步配置弹层 */
  #mask{position:fixed;inset:0;background:rgba(20,35,28,.45);display:none;z-index:90}
  #mask.show{display:block}
  #cfgModal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,380px);
    background:#fff;border-radius:16px;padding:20px;display:none;z-index:95;box-shadow:0 10px 40px rgba(0,0,0,.18)}
  #cfgModal.show{display:block}
  #cfgModal h3{font-size:16px;margin-bottom:4px}
  #cfgModal .tip{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:12px}
  #cfgModal label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  #cfgModal input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;
    font-size:14px;outline:none;background:#fafcfb}
  #cfgModal input:focus{border-color:var(--accent)}
  #cfgModal .btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  #cfgModal .btns button{flex:1;border:none;border-radius:10px;padding:10px 0;font-size:14px;cursor:pointer;font-weight:600}
  .btn-main{background:var(--accent);color:#fff}
  .btn-ghost{background:#f0f4f1;color:var(--text)}
  .btn-danger{background:#fdf0f0;color:var(--danger)}
  #cfgStatus{font-size:12px;margin-top:10px;color:var(--sub);word-break:break-all}
  #cfgFp{font-size:11px;color:var(--sub);margin-top:6px;letter-spacing:1px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="2.5" y="9" width="19" height="7" rx="3.5" transform="rotate(-45 12 12)" fill="#fff" opacity=".95"/>
        <path d="M7.8 7.8 L16.2 16.2" stroke="#1f9d63" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>吃药打卡</h1>
    <div class="date" id="todayLabel"></div>
    <button class="chip" id="syncChip" title="云同步设置">同步：未配置</button>
  </header>

  <section class="card">
    <div class="progress-top">
      <span class="label">今日进度</span>
      <span class="num" id="progressNum">0/0</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
  </section>

  <div class="all-done" id="allDone">今日药品已全部服用完成，记得明天继续哦</div>

  <form class="card add" id="addForm">
    <input id="medName" placeholder="输入药品名称" maxlength="20" autocomplete="off">
    <select id="medTimes">
      <option value="1">每天1次</option>
      <option value="2" selected>每天2次</option>
      <option value="3">每天3次</option>
      <option value="4">每天4次</option>
      <option value="5">每天5次</option>
      <option value="6">每天6次</option>
    </select>
    <button type="submit">添加</button>
  </form>

  <ul id="medList"></ul>
  <div class="empty" id="empty">还没有添加药品<br>在上方输入名称，选择每天的服用次数即可</div>

  <footer>到服药时间 15 分钟后仍未打卡，会自动推送到微信（需完成云同步配置）<br>数据保存在本机，配置云同步后加密备份到你的 GitHub 仓库</footer>
</div>

<div id="mask"></div>
<div id="cfgModal">
  <h3>云同步设置</h3>
  <div class="tip">打卡数据加密后保存到你自己的 GitHub 私密内容里，并由 GitHub 定时任务检查“到点未吃”，通过 WxPusher 推送到微信。填写方法见部署指南 README。</div>
  <label>GitHub Token（Fine-grained，需 Contents 读写权限）</label>
  <input id="cfgToken" placeholder="github_pat_..." autocomplete="off">
  <label>仓库（格式：用户名/仓库名）</label>
  <input id="cfgRepo" placeholder="yourname/med-reminder" autocomplete="off">
  <label>数据密码（与仓库 Secrets 里的 DATA_PASSPHRASE 一致）</label>
  <input id="cfgPass" type="password" placeholder="自定义一个不会忘的密码" autocomplete="off">
  <div id="cfgFp"></div>
  <div class="btns">
    <button class="btn-main" id="cfgSave">保存并同步</button>
    <button class="btn-ghost" id="cfgSync">立即同步</button>
    <button class="btn-danger" id="cfgOff">断开</button>
  </div>
  <div id="cfgStatus"></div>
</div>

<div id="toast"></div>

<script>
(function(){
  var LS_MEDS='medcheck.meds', LS_REC='medcheck.records', LS_REM='medcheck.reminded', LS_CFG='medsync.cfg';
  var meds=load(LS_MEDS,[]);        // [{id,name,times,slots:['08:00',...]}]
  var records=load(LS_REC,{});      // { 'YYYY-MM-DD': { medId: 已服次数 } }
  var reminded=load(LS_REM,{});     // { date: { 'medId-slotIdx': true } } 由服务端写入，本地只透传
  var cfg=load(LS_CFG,null);        // {token, repo, pass}

  function load(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
  function saveLocal(){
    localStorage.setItem(LS_MEDS,JSON.stringify(meds));
    localStorage.setItem(LS_REC,JSON.stringify(records));
    localStorage.setItem(LS_REM,JSON.stringify(reminded));
  }
  function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function pad(n){ return n<10?'0'+n:''+n; }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function taken(key,id){ return (records[key]&&records[key][id])||0; }
  function defaultSlots(n){
    return {1:['09:00'],2:['08:00','20:00'],3:['08:00','12:30','19:00'],
            4:['08:00','12:00','16:00','20:00'],5:['07:30','11:00','14:30','18:00','21:30'],
            6:['07:00','10:00','13:00','16:00','19:00','22:00']}[n]||[];
  }
  meds.forEach(function(m){ if(!m.slots||!m.slots.length) m.slots=defaultSlots(m.times); });

  var $list=document.getElementById('medList'),$empty=document.getElementById('empty'),
      $allDone=document.getElementById('allDone'),$num=document.getElementById('progressNum'),
      $bar=document.getElementById('barFill'),$toast=document.getElementById('toast'),
      $chip=document.getElementById('syncChip');
  var toastTimer=null;
  function toast(msg){
    $toast.textContent=msg; $toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ $toast.classList.remove('show'); },1800);
  }

  /* ---------------- 渲染 ---------------- */
  function render(){
    var key=todayKey(), d=new Date();
    document.getElementById('todayLabel').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()];
    var total=0,done=0,html='';
    meds.forEach(function(m){
      var c=Math.min(taken(key,m.id),m.times), all=c>=m.times;
      total+=m.times; done+=c;
      html+='<li class="card med'+(all?' done':'')+'">'
         +  '<button class="del" data-del="'+m.id+'" title="删除">&times;</button>'
         +  '<div class="name" data-editname="'+m.id+'" title="点击修改名称">'+esc(m.name)+'</div>'
         +  '<div class="sub">每天 '+m.times+' 次 · 今日 '+c+'/'+m.times+(all?' · 已完成':'')+'</div>'
         +  '<div class="dots">';
      for(var i=0;i<m.times;i++){
        var t=(m.slots&&m.slots[i])||'--:--';
        html+='<span class="slot">'
           +  '<button class="dot'+(i<c?' on':'')+'" data-id="'+m.id+'" data-slot="'+i+'" aria-label="第'+(i+1)+'次">'+(i<c?'✓':'')+'</button>'
           +  '<span class="stime" data-stime="'+m.id+'|'+i+'" title="点击修改服药时间">'+esc(t)+'</span>'
           +  '</span>';
      }
      html+='</div><div class="history"><span class="h-label">近7天</span>';
      for(var off=6;off>=0;off--){
        var dd=new Date(); dd.setDate(dd.getDate()-off);
        var k2=dd.getFullYear()+'-'+pad(dd.getMonth()+1)+'-'+pad(dd.getDate());
        var c2=taken(k2,m.id), st=c2>=m.times?'full':(c2>0?'partial':'');
        if(off===0) st+=' today';
        html+='<span class="h '+st+'">'+'日一二三四五六'[dd.getDay()]+'</span>';
      }
      html+='</div></li>';
    });
    $list.innerHTML=html;
    $empty.classList.toggle('show',meds.length===0);
    $allDone.classList.toggle('show',meds.length>0&&done>=total);
    $num.textContent=done+'/'+total;
    $bar.style.width=(total?(done/total*100):0)+'%';
  }

  function toggle(id,slot){
    var key=todayKey(); records[key]=records[key]||{};
    var c=taken(key,id);
    c=(slot<c)?slot:slot+1;
    if(c<=0) delete records[key][id]; else records[key][id]=c;
    saveLocal(); render(); schedulePush();
  }
  function removeMed(id){
    var m=meds.filter(function(x){return x.id===id;})[0]; if(!m) return;
    if(!confirm('删除「'+m.name+'」？其历史记录也会一并删除。')) return;
    meds=meds.filter(function(x){return x.id!==id;});
    Object.keys(records).forEach(function(k){ delete records[k][id]; });
    saveLocal(); render(); schedulePush(); toast('已删除 '+m.name);
  }
  function editName(id){
    var m=meds.filter(function(x){return x.id===id;})[0]; if(!m) return;
    var v=prompt('修改药品名称',m.name);
    if(v===null) return;
    v=v.trim();
    if(!v){ toast('名称不能为空'); return; }
    if(v===m.name) return;
    m.name=v.slice(0,20);
    saveLocal(); render(); schedulePush(); toast('已改名为 '+m.name);
  }
  function editTime(id,idx){
    var m=meds.filter(function(x){return x.id===id;})[0]; if(!m) return;
    var cur=(m.slots&&m.slots[idx])||'08:00';
    var v=prompt('设置「'+m.name+'」第'+(idx+1)+'次的服药时间\n（到点 15 分钟后还没打卡就会推送提醒）',cur);
    if(v===null) return;
    v=v.trim();
    var mm=/^([01]?\d|2[0-3]):([0-5]\d)$/.exec(v);
    if(!mm){ toast('时间格式不对，应为 HH:MM'); return; }
    m.slots=m.slots||[]; m.slots[idx]=pad(+mm[1])+':'+mm[2];
    saveLocal(); render(); schedulePush(); toast('已更新服药时间 '+m.slots[idx]);
  }

  document.getElementById('addForm').addEventListener('submit',function(e){
    e.preventDefault();
    var input=document.getElementById('medName'), name=input.value.trim();
    if(!name){ toast('请先输入药品名称'); input.focus(); return; }
    var times=parseInt(document.getElementById('medTimes').value,10);
    meds.push({id:Date.now()+''+Math.floor(Math.random()*1000),name:name,times:times,slots:defaultSlots(times)});
    saveLocal(); render(); schedulePush();
    input.value=''; input.focus(); toast('已添加 '+name);
  });
  $list.addEventListener('click',function(e){
    var dot=e.target.closest('.dot');
    if(dot){ toggle(dot.getAttribute('data-id'),parseInt(dot.getAttribute('data-slot'),10)); return; }
    var st=e.target.closest('.stime');
    if(st){ var p=st.getAttribute('data-stime').split('|'); editTime(p[0],parseInt(p[1],10)); return; }
    var nm=e.target.closest('.name');
    if(nm){ editName(nm.getAttribute('data-editname')); return; }
    var del=e.target.closest('.del');
    if(del){ removeMed(del.getAttribute('data-del')); }
  });

  /* ---------------- 云同步（GitHub + AES-GCM 加密） ---------------- */
  var te=new TextEncoder(), td=new TextDecoder();
  function b2s(u8){ var s=''; for(var i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return s; }
  async function deriveKey(pass,salt){
    var km=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  async function encStr(obj,pass){
    var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    var key=await deriveKey(pass,salt);
    var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,te.encode(JSON.stringify(obj))));
    var out=new Uint8Array(28+ct.length); out.set(salt,0); out.set(iv,16); out.set(ct,28);
    return 'ENC1:'+btoa(b2s(out));
  }
  async function decStr(s,pass){
    if(s.indexOf('ENC1:')!==0) throw new Error('数据文件格式不对（可能没加密）');
    var raw=Uint8Array.from(atob(s.slice(5)),function(c){return c.charCodeAt(0);});
    var key=await deriveKey(pass,raw.slice(0,16));
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},key,raw.slice(28));
    return JSON.parse(td.decode(pt));
  }
  function ghHeaders(){ return {Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}; }
  // 密码指纹：密码哈希前 8 位，用于和 Actions 日志里的「数据密码指纹」肉眼比对
  async function passFp(p){
    if(!p) return '';
    var h=new Uint8Array(await crypto.subtle.digest('SHA-256',te.encode(p))),s='';
    for(var i=0;i<4;i++) s+=('0'+h[i].toString(16)).slice(-2);
    return s;
  }
  async function updateFp(){
    var fp=await passFp(document.getElementById('cfgPass').value);
    document.getElementById('cfgFp').textContent=fp?('密码指纹：'+fp+'（应与 Actions 运行日志里的「数据密码指纹」一致）'):'';
  }
  var ghSha=null;
  async function ghGet(){
    var r=await fetch('https://api.github.com/repos/'+cfg.repo+'/contents/data.enc',{headers:ghHeaders(),cache:'no-store'});
    if(r.status===404) return {sha:null,raw:null};
    if(!r.ok){
      var m1=''; try{ m1=' '+(await r.json()).message; }catch(e){}
      throw new Error('GitHub 读取失败 ('+r.status+')'+m1);
    }
    var j=await r.json();
    return {sha:j.sha,raw:td.decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),function(c){return c.charCodeAt(0);}))};
  }
  async function ghPut(){
    var body=await encStr({meds:meds,records:records,reminded:reminded},cfg.pass);
    var payload={message:'打卡数据同步',content:btoa(body),branch:'main'};
    if(ghSha) payload.sha=ghSha;
    var r=await fetch('https://api.github.com/repos/'+cfg.repo+'/contents/data.enc',{
      method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),
      body:JSON.stringify(payload)});
    if(!r.ok){
      var m2=''; try{ m2=' '+(await r.json()).message; }catch(e){}
      throw new Error('GitHub 写入失败 ('+r.status+')'+m2);
    }
    var j=await r.json(); ghSha=j.content.sha;
  }
  function mergeRemote(obj){
    var remote=obj.records||{};
    Object.keys(records).concat(Object.keys(remote)).forEach(function(d){
      var a=records[d]||{},b=remote[d]||{},m={};
      Object.keys(a).concat(Object.keys(b)).forEach(function(k){ m[k]=Math.max(a[k]||0,b[k]||0); });
      records[d]=m;
    });
    if(obj.reminded) reminded=obj.reminded;
  }
  function setChip(state,msg){
    var map={ok:['ok','已同步'],busy:['busy','同步中…'],pending:['busy','待同步…'],err:['err','同步失败'],local:['','未配置']};
    var it=map[state]||['','未配置'];
    $chip.className='chip '+it[0];
    $chip.textContent='同步：'+(state==='ok'&&msg?msg:it[1]);
  }
  var syncing=false,pendingPush=false,pushTimer=null,lastSync='';
  async function flushPush(){
    if(syncing){ pendingPush=true; return; }
    syncing=true; setChip('busy');
    try{
      try{ await ghPut(); }
      catch(e){
        // 冲突：拉远端合并后重试一次
        var g=await ghGet(); ghSha=g.sha;
        if(g.raw){
          try{ mergeRemote(await decStr(g.raw,cfg.pass)); }
          catch(e2){ /* 远端是其他密码加密的数据：直接覆盖 */ }
        }
        await ghPut();
      }
      lastSync=pad(new Date().getHours())+':'+pad(new Date().getMinutes());
      saveLocal(); setChip('ok',lastSync);
    }catch(e){ setChip('err'); console.warn(e); }
    syncing=false;
    if(pendingPush){ pendingPush=false; flushPush(); }
  }
  function schedulePush(){
    if(!cfg){ setChip('local'); return; }
    pendingPush=true; setChip('pending');
    clearTimeout(pushTimer); pushTimer=setTimeout(flushPush,800);
  }
  async function syncNow(){
    if(!cfg){ openCfg(); return; }
    if(syncing) return;
    if(pendingPush){ clearTimeout(pushTimer); pendingPush=false; await flushPush(); return; }
    syncing=true; setChip('busy');
    try{
      var g=await ghGet(); ghSha=g.sha;
      if(!g.raw){
        if(meds.length){ await ghPut(); lastSync=pad(new Date().getHours())+':'+pad(new Date().getMinutes()); setChip('ok',lastSync); }
        else setChip('ok','空仓库');
      }else{
        var obj;
        try{ obj=await decStr(g.raw,cfg.pass); }
        catch(e2){
          if(confirm('远端数据用当前的数据密码解不开（之前可能用的是别的密码）。\n\n点「确定」：用本设备当前的数据覆盖远端；\n点「取消」：先检查密码是否输入正确。')){
            await ghPut(); lastSync=pad(new Date().getHours())+':'+pad(new Date().getMinutes()); saveLocal(); setChip('ok',lastSync); toast('已用当前数据覆盖远端');
          }else{ setChip('err'); toast('同步失败：远端数据与当前密码不一致'); }
          syncing=false; return;
        }
        meds=obj.meds||[]; records=obj.records||{}; reminded=obj.reminded||{};
        meds.forEach(function(m){ if(!m.slots||!m.slots.length) m.slots=defaultSlots(m.times); });
        saveLocal(); render();
        lastSync=pad(new Date().getHours())+':'+pad(new Date().getMinutes());
        setChip('ok',lastSync);
      }
    }catch(e){ setChip('err'); toast('同步失败：'+e.message); }
    syncing=false;
  }

  /* ---------------- 配置弹层 ---------------- */
  var $mask=document.getElementById('mask'),$modal=document.getElementById('cfgModal'),
      $cst=document.getElementById('cfgStatus');
  function openCfg(){
    document.getElementById('cfgToken').value=cfg?cfg.token:'';
    document.getElementById('cfgRepo').value=cfg?cfg.repo:'';
    document.getElementById('cfgPass').value=cfg?cfg.pass:'';
    updateFp();
    $cst.textContent=cfg?('当前状态：'+$chip.textContent.replace('同步：','')):'';
    $mask.classList.add('show'); $modal.classList.add('show');
  }
  function closeCfg(){ $mask.classList.remove('show'); $modal.classList.remove('show'); }
  $chip.addEventListener('click',openCfg);
  $mask.addEventListener('click',closeCfg);
  document.getElementById('cfgPass').addEventListener('input',updateFp);
  document.getElementById('cfgSave').addEventListener('click',function(){
    var token=document.getElementById('cfgToken').value.trim(),
        repo=document.getElementById('cfgRepo').value.trim(),
        pass=document.getElementById('cfgPass').value;
    if(!token||!repo||!pass){ $cst.textContent='请把三项都填写完整'; return; }
    if(repo.indexOf('/')<0){ $cst.textContent='仓库格式应为 用户名/仓库名'; return; }
    cfg={token:token,repo:repo,pass:pass};
    localStorage.setItem(LS_CFG,JSON.stringify(cfg));
    $cst.textContent='已保存，正在连接…';
    closeCfg(); syncNow();
  });
  document.getElementById('cfgSync').addEventListener('click',function(){ closeCfg(); syncNow(); });
  document.getElementById('cfgOff').addEventListener('click',function(){
    if(!confirm('断开云同步？本地数据仍会保留。')) return;
    cfg=null; ghSha=null; localStorage.removeItem(LS_CFG); setChip('local'); closeCfg(); toast('已断开云同步');
  });

  document.addEventListener('visibilitychange',function(){
    if(document.hidden) return;
    if(cfg){ if(pendingPush){ clearTimeout(pushTimer); flushPush(); } else syncNow(); }
    else render();
  });

  if(cfg) syncNow(); else { render(); setChip('local'); }
  render();
})();
</script>
</body>
</html>
