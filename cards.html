<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f9d63">
<title>梁山卡册</title>
<style>
  :root{
    --accent:#1f9d63;
    --accent-soft:#e3f5ec;
    --bg1:#eef5f0;
    --bg2:#e4eef7;
    --card:#ffffff;
    --text:#1d2b26;
    --sub:#7b8a84;
    --line:#e7ece9;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;color:var(--text)}
  .app{max-width:430px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}

  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  header .back{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--sub);
    text-decoration:none;flex:none;line-height:1}
  header h1{font-size:21px;font-weight:700}
  header .prog{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent)}

  .card{background:var(--card);border-radius:16px;padding:16px;
    box-shadow:0 2px 10px rgba(30,60,45,.06);margin-bottom:12px}

  .sum-bar{height:9px;border-radius:99px;background:#e8efe9;overflow:hidden}
  .sum-bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#35b878,#1f9d63);transition:width .4s ease}
  .sum-row{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;color:var(--sub)}
  .sum-row b{color:var(--accent)}

  .filters{display:flex;gap:7px;margin-bottom:13px;overflow-x:auto;padding-bottom:2px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .f{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;
    padding:6px 13px;font-size:12.5px;color:var(--sub);cursor:pointer}
  .f.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

  /* 卡牌（与首页共用） */
  .hw-card{position:relative;border-radius:12px;padding:12px 6px 10px;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    border:2px solid transparent;text-align:center;cursor:pointer;transition:transform .12s}
  .hw-card:active{transform:scale(.95)}
  .hw-card.legend{background:linear-gradient(160deg,#fffbe8,#ffe9b0 55%,#eed07a);
    border-color:#c9a227;box-shadow:0 4px 12px rgba(150,110,0,.2)}
  .hw-card.epic{background:linear-gradient(160deg,#f2f9fd,#d3e8f6 55%,#aad4ea);
    border-color:#4a8fb5;box-shadow:0 4px 12px rgba(40,90,130,.18)}
  .hw-card .hw-rank{position:absolute;top:4px;left:6px;font-size:9.5px;opacity:.55}
  .hw-card .hw-star{font-size:9.5px;letter-spacing:.5px;margin-top:3px}
  .hw-card .hw-nick{font-size:19px;font-weight:800;letter-spacing:.5px;line-height:1.2;
    white-space:nowrap}
  .hw-card .hw-name{font-size:11px;letter-spacing:.5px}
  .hw-card.legend .hw-star{color:#8a6d1a}
  .hw-card.legend .hw-nick{color:#43310a}
  .hw-card.legend .hw-name{color:#8a7340}
  .hw-card.epic .hw-star{color:#2f6d92}
  .hw-card.epic .hw-nick{color:#123d57}
  .hw-card.epic .hw-name{color:#3f6b84}

  /* 未收集 */
  .hw-card.locked{background:#f1f4f2;border-color:#e3e8e5;box-shadow:none}
  .hw-card.locked .hw-star{color:#b6c0ba}
  .hw-card.locked .hw-nick{color:#b1bcb6;font-size:24px;font-weight:700}
  .hw-card.locked .hw-name{color:#bfc8c3}

  .allget{display:none;background:linear-gradient(135deg,#fffbe8,#ffe9b0);border:1px solid #e8cf85;
    color:#7a5c00;border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600;
    margin-bottom:12px;text-align:center}
  .allget.show{display:block}

  footer{text-align:center;font-size:12px;color:#a5b1ab;margin-top:18px;line-height:1.7}

  /* 详情弹窗 */
  #pop{position:fixed;inset:0;background:rgba(24,18,6,.72);z-index:120;display:none;
    align-items:center;justify-content:center;padding:26px}
  #pop.show{display:flex}
  .pop-inner{width:100%;max-width:280px;text-align:center}
  #popCard .hw-card{padding:22px 12px 18px;border-radius:16px;
    animation:popIn .38s cubic-bezier(.2,1.4,.4,1)}
  #popCard .hw-nick{font-size:32px}
  @keyframes popIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .pop-info{margin-top:14px;background:rgba(255,255,255,.93);border-radius:12px;
    padding:12px 16px;font-size:12.5px;color:#4a5751;line-height:1.9}
  .pop-info .pi-row{display:flex;justify-content:space-between}
  .pop-info .pi-row span:first-child{color:#9aa8a1}
  .pop-close{display:block;margin:14px auto 0;border:none;border-radius:99px;
    background:rgba(255,255,255,.2);color:#fff;font-size:13px;padding:9px 30px;cursor:pointer}

  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:#223330;color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;
    opacity:0;pointer-events:none;transition:all .25s;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="index.html" title="返回打卡">‹</a>
    <h1>梁山卡册</h1>
    <div class="prog" id="prog">0/108</div>
  </header>

  <section class="card">
    <div class="sum-bar"><i id="sumFill"></i></div>
    <div class="sum-row">
      <span>已收集 <b id="sumGot">0</b> 位</span>
      <span>天罡 <b id="sumLg">0</b>/36 · 地煞 <b id="sumEp">0</b>/72</span>
    </div>
  </section>

  <div class="allget" id="allGet">一百单八将，尽入我册！</div>

  <div class="filters" id="filters">
    <button class="f on" data-f="all">全部 108</button>
    <button class="f" data-f="legend">天罡 36</button>
    <button class="f" data-f="epic">地煞 72</button>
    <button class="f" data-f="got">已收集</button>
    <button class="f" data-f="miss">未收集</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>每种药当天吃完，就能抽一张好汉卡（一天一种药限一张）<br>卡片保存在本机，与打卡数据同一份本地存储</footer>
</div>

<div id="pop">
  <div class="pop-inner">
    <div id="popCard"></div>
    <div class="pop-info" id="popInfo"></div>
    <button class="pop-close" id="popClose">关闭</button>
  </div>
</div>

<div id="toast"></div>

<script src="heroes.js"></script>
<script>
(function(){
  var LS_CARDS='medcheck.cards';          // { rank: 'YYYY-MM-DD' }
  var HEROES=window.HEROES||[];
  var owned=load(LS_CARDS,{});
  var filter='all', query='';

  function load(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function cardCls(h){ return h.rank<=36?'legend':'epic'; }

  var $grid=document.getElementById('grid');

  function render(){
    var got=Object.keys(owned).length;
    var lg=0,ep=0;
    Object.keys(owned).forEach(function(r){ if(+r<=36) lg++; else ep++; });

    document.getElementById('prog').textContent=got+'/'+HEROES.length;
    document.getElementById('sumGot').textContent=got;
    document.getElementById('sumLg').textContent=lg;
    document.getElementById('sumEp').textContent=ep;
    document.getElementById('sumFill').style.width=(got/HEROES.length*100)+'%';
    document.getElementById('allGet').classList.toggle('show',got>=HEROES.length&&HEROES.length>0);

    var list=HEROES.filter(function(h){
      if(filter==='legend') return h.rank<=36;
      if(filter==='epic')   return h.rank>=37;
      if(filter==='got')    return !!owned[h.rank];
      if(filter==='miss')   return !owned[h.rank];
      return true;
    });

    if(!list.length){
      $grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--sub);font-size:13.5px;padding:36px 0">这里还没有卡片</div>';
      return;
    }

    $grid.innerHTML=list.map(function(h){
      var date=owned[h.rank];
      if(date){
        return '<div class="hw-card '+cardCls(h)+'" data-rank="'+h.rank+'">'
          +  '<span class="hw-rank">第'+h.rank+'位</span>'
          +  '<span class="hw-star">'+esc(h.star)+'</span>'
          +  '<span class="hw-nick">'+esc(h.nick)+'</span>'
          +  '<span class="hw-name">'+esc(h.name)+'</span>'
          +  '</div>';
      }
      return '<div class="hw-card locked" data-rank="'+h.rank+'">'
        +  '<span class="hw-rank">第'+h.rank+'位</span>'
        +  '<span class="hw-star">'+(h.rank<=36?'天罡':'地煞')+'</span>'
        +  '<span class="hw-nick">?</span>'
        +  '<span class="hw-name">待收集</span>'
        +  '</div>';
    }).join('');
  }

  // 筛选
  document.getElementById('filters').addEventListener('click',function(e){
    var b=e.target.closest('.f'); if(!b) return;
    filter=b.getAttribute('data-f');
    Array.prototype.forEach.call(document.querySelectorAll('.f'),function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    render();
  });

  // 点击卡片
  $grid.addEventListener('click',function(e){
    var c=e.target.closest('.hw-card'); if(!c) return;
    var rank=+c.getAttribute('data-rank');
    var h=HEROES.filter(function(x){ return x.rank===rank; })[0];
    if(!h) return;
    var date=owned[rank];
    if(!date){ toast('还没收集到这张，继续打卡吧'); return; }
    showPop(h,date);
  });

  function showPop(h,date){
    document.getElementById('popCard').innerHTML=
      '<div class="hw-card '+cardCls(h)+'">'
      +  '<span class="hw-rank">第'+h.rank+'位</span>'
      +  '<span class="hw-star">'+esc(h.star)+'</span>'
      +  '<span class="hw-nick">'+esc(h.nick)+'</span>'
      +  '<span class="hw-name">'+esc(h.name)+'</span>'
      +  '</div>';
    document.getElementById('popInfo').innerHTML=
        '<div class="pi-row"><span>座次</span><span>第 '+h.rank+' 位</span></div>'
      + '<div class="pi-row"><span>星号</span><span>'+esc(h.star)+'</span></div>'
      + '<div class="pi-row"><span>绰号</span><span>'+esc(h.nick)+'</span></div>'
      + '<div class="pi-row"><span>姓名</span><span>'+esc(h.name)+'</span></div>'
      + '<div class="pi-row"><span>获得日期</span><span>'+esc(date)+'</span></div>';
    document.getElementById('pop').classList.add('show');
  }
  document.getElementById('popClose').addEventListener('click',function(){
    document.getElementById('pop').classList.remove('show');
  });
  document.getElementById('pop').addEventListener('click',function(e){
    if(e.target.id==='pop') this.classList.remove('show');
  });

  var tTimer=null;
  function toast(msg){
    var $t=document.getElementById('toast');
    $t.textContent=msg; $t.classList.add('show');
    clearTimeout(tTimer); tTimer=setTimeout(function(){ $t.classList.remove('show'); },1700);
  }

  // 别的页面抽了卡后切回来，刷新一下
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) return;
    owned=load(LS_CARDS,{});
    render();
  });

  render();
})();
</script>
</body>
</html>
